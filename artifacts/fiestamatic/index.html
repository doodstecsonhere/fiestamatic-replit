    <!-- Service Worker registration -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('/sw.js')
            .then(function (reg) {
              console.log('[Fiestamatic] Service Worker registered', reg.scope);
            })
            .catch(function (err) {
              console.warn('[Fiestamatic] Service Worker registration failed', err);
            });
        });
      }
    </script>
